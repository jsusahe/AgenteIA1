name: Agente IA Diario

on:
  schedule:
    - cron: '0 8 * * *'  # Ejecuta a las 8:00 AM UTC
  workflow_dispatch:      # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # PASO 1: Instalar Deno (necesario para resolver desafíos JS de YouTube)
      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # PASO 2: Restaurar cookies desde el secreto
      - name: Restaurar cookies de YouTube
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" | base64 -d > cookies.txt
        shell: bash

      # PASO 3: Verificar que el archivo de cookies se creó (opcional, para depuración)
      - name: Verificar archivo de cookies
        run: |
          echo "Primera línea del archivo cookies.txt:"
          head -n 1 cookies.txt
          echo "Tamaño del archivo en bytes:"
          wc -c cookies.txt
        shell: bash

      # PASO 4: Instalar dependencias Python
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib requests edge-tts python-dotenv yt-dlp-ejs

      # PASO 5: Ejecutar el agente
      - name: Ejecutar Agente
        run: python main.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PARENT_FOLDER_ID: ${{ secrets.PARENT_FOLDER_ID }}

      # PASO 6: Subir artefactos (resultados)
      - name: Subir Artefactos
        if: success() && (hashFiles('index.html') || hashFiles('resumen_ia.mp3'))
        uses: actions/upload-artifact@v4
        with:
          name: resultados-ia
          path: |
            index.html
            resumen_ia.mp3
