name: Agente IA Diario

on:
  schedule:
    # Ejecuta a las 8:00 AM UTC todos los días (ajusta según tu zona horaria)
    - cron: '0 8 * * *'
  # Permite ejecutar el workflow manualmente desde la pestaña "Actions"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # PASO 1: Descargar el código del repositorio
      - name: Checkout código
        uses: actions/checkout@v4

      # PASO 2: Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # PASO 3: Instalar Deno (necesario para resolver desafíos JS de YouTube)
      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # PASO 4: RESTAURAR COOKIES (AÑADIDO AQUÍ)
      - name: Restaurar cookies de YouTube
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" | base64 -d > cookies.txt
        shell: bash

      # PASO 5: VERIFICAR COOKIES (AÑADIDO AQUÍ)
      - name: Verificar archivo de cookies
        run: |
          echo "Primera línea del archivo cookies.txt:"
          head -n 1 cookies.txt
          echo "Tamaño del archivo en bytes:"
          wc -c cookies.txt
        shell: bash

      # PASO 6: Instalar dependencias Python
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib requests edge-tts python-dotenv yt-dlp-ejs

      # PASO 7: Ejecutar el agente
      - name: Ejecutar Agente
        run: python main.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PARENT_FOLDER_ID: ${{ secrets.PARENT_FOLDER_ID }}

      # PASO 8: Subir artefactos (resultados)
      - name: Subir Artefactos
        if: success() && (hashFiles('index.html') || hashFiles('resumen_ia.mp3'))
        uses: actions/upload-artifact@v4
        with:
          name: resultados-ia
          path: |
            index.html
            resumen_ia.mp3
