name: Actualizar Histórico en index.html

on:
  # Permite ejecutar el workflow manualmente desde la pestaña "Actions"
  workflow_dispatch:
  # Opcional: ejecuta 5 minutos después del workflow principal (si quieres automatizarlo)
  # schedule:
  #   - cron: '5 8 * * *'  # 8:05 AM UTC

jobs:
  update-history:
    runs-on: ubuntu-latest
    
    steps:
      # PASO 1: Descargar el código del repositorio
      - name: Checkout código
        uses: actions/checkout@v4

      # PASO 2: Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # PASO 3: Instalar dependencias (si las hay)
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # No se requieren dependencias adicionales para este script

      # PASO 4: Ejecutar el script de actualización de histórico
      - name: Ejecutar update_history.py
        run: python update_history.py

      # PASO 5: Subir el index.html actualizado al repositorio
      - name: Subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Actualizar histórico en index.html [skip ci]" || echo "No hay cambios para commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}